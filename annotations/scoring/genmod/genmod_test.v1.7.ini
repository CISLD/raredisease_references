[Version]
version = 1.5
name = rank_model_cmms

[Categories]
  [[allele_frequency]]
    category_aggregation = min
  [[Protein_prediction]]
    category_aggregation = sum
  [[Inheritance_Models]]
    category_aggregation = min
  [[Consequence]]
    category_aggregation = max
  [[Conservation]]
    category_aggregation = sum
  [[Variant_call_quality_filter]]
    category_aggregation = max
  [[Deleteriousness]]
    category_aggregation = max
  [[Clinical_significance]]
