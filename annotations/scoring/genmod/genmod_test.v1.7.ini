[GNOMADAF]
  field = INFO
  data_type = float
  category = allele_frequency
  record_rule = max
  separators = ','
  info_key = GNOMADAF
  description = gnomAD allele frequency

  [[not_reported]]
    score = 3
  [[common]]
    score = -12
    lower = 0.02
    upper = 1.0
  [[intermediate]]
    score = 1
    lower = 0.005
    upper = 0.02
  [[rare]]
    score = 2
    lower = 0
    upper = 0.005

