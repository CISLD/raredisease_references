# -----------------------------------------------------------------------------
# [filter] DISABLED in v2.02 -- awaiting a decision.
#
# It does not measure call quality, it distinguishes callers. Manta records reach
# the merged VCF with FILTER=PASS and collect 3 points; gatkCNV segments arrive
# with FILTER=. and collect 0, because SVDB was run with --pass_only and the
# label is not carried through the merge. Real quality filtering has already
# happened upstream, so nothing failing is present to penalise.
#
# Net effect under v2.01: a whole-gene deletion found by gatkCNV could not exceed
# roughly 22 points while a 65 bp tandem duplication from Manta reached 29 -- the
# wrong way round for exome diagnostics.
#
# To restore, delete the leading '# ' from the block below. Doing so returns the
# range top from 32 to 35.
#
# [filter]
#   category = variant_call_quality_filter
#   data_type = string
#   description = The filters for the variant
#   field = FILTER
#   record_rule = min
#   separators = ';',
#
#   [[not_reported]]
#     score = 0
#
#   [[pass]]
#     score = 3
#     priority = 1
#     string = 'PASS'
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# DRAFT [sv_type] -- category variant_type has no plugin and always scores 0.
# Type is one of the strongest SV discriminators: translocations are largely
# artefacts, a deletion in a constrained gene is often the answer itself.
# Requires INFO/SVTYPE, which gatkCNV segments do not currently carry.
# No negative scores, per the principle at the top of this file.
#
# [sv_type]
#   category = variant_type
#   data_type = string
#   description = Type of the structural variant
#   field = INFO
#   info_key = SVTYPE
#   record_rule = max
#   separators = ',', ':',
#
#   [[not_reported]]
#     score = 0
#
#   [[DEL]]
#     score = 4
#     priority = 4
#     string = 'DEL'
#
#   [[DUP]]
#     score = 3
#     priority = 3
#     string = 'DUP'
#
#   [[INV]]
#     score = 1
#     priority = 2
#     string = 'INV'
#
#   [[INS]]
#     score = 3
#     priority = 3
#     string = 'INS'
#
#   [[BND]]
