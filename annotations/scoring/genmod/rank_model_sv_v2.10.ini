# =============================================================================
# rank_model_sv v2.10   (from v2.06) -- needs no extra pipeline script
# =============================================================================
# v2.06 needed sv_annotate.py for two INFO fields. v2.10 reads the same
# information straight from the VEP CSQ field, so it runs on the SV VCF as the
# pipeline writes it (VEP 116, SVDB config svdb_query_dbs_20260825.csv).
#
# (Y1) [sv_exonic] (SV_EXONIC) replaced by [sv_exon_hit]: CSQ EXON filled in any
#      transcript scores 8 in category consequence (max, so transcript_ablation
#      = 10 still wins). Unlike SV_EXONIC it does not require BIOTYPE =
#      protein_coding: genmod cannot join EXON and BIOTYPE per transcript. On
#      one WGS case it fires on 1,949 SVs instead of 1,135 (extra: lncRNA and
#      pseudogene exons), with no measurable effect on the top 50.
#      Needed: without it the PKLR hom DEL falls from 61 to 1008; at score 4, 458.
# (Y2) [gene_intolerance_score] reads CSQ pLI_gene_value as a numeric max
#      (csq_key) instead of SV_PLI; identical values, no script needed.
# Everything else, including the v2.06 LoqusDB bins on LOQUSDB_OBS, is v2.06.
# Validation: rankmodel_sv_v210/results/eval_v210.txt.
# History v2.01-v2.06: rankmodel_sv_v205/results/rank_model_sv_v2.06.ini
# =============================================================================

[Version]
  version = 2.10
  name = svrank_model

[Categories]
 [[allele_frequency]]
   category_aggregation = min

 [[clinical_significance]]
   category_aggregation = sum

 [[consequence]]
   category_aggregation = max

 [[gene_intolerance_prediction]]
   category_aggregation = sum

 [[inheritance_models]]
   category_aggregation = min

 [[variant_call_quality_filter]]
   category_aggregation = sum

 [[variant_length]]
    category_aggregation = min

 [[variant_type]]
    category_aggregation = min

[gnomad_sv]
  category = allele_frequency
  data_type = float
  description = Gnomad sv genomes frequency
  field = INFO
  info_key = gnomad_svAF
  record_rule = max
  separators = ','

  [[not_reported]]
    score = 5

  [[common]]
    score = 0
    lower = 0.05
    upper = 1.1

  [[intermediate]]
    score = 1
    lower = 0.005
    upper = 0.05

 [[rare]]
    score = 2
    lower = 0.0005
    upper = 0.005

 [[very_rare]]
    score = 5
    lower = 0
    upper = 0.0005

[loqusdb_obs_sv]
  category = allele_frequency
  data_type = integer
  description = In-house LoqusDB SV observations, counted in CASES not alleles
  field = INFO
  info_key = LOQUSDB_OBS
  record_rule = max
  separators = ','

# (X1) v2.06 bins. Same key and structure as v2.04/v2.05; cut-offs lowered
# because only ~106 WGS cases are in the export (WGS median Obs 23), so v2.05's
# 0-49 = very_rare let recurrent WGS artefacts keep the full +5.
# 0-9 stays at 5 so recurrent founder deletions (an HBB deletion had Obs 9)
# are not penalised. Half-open bins [lower, upper).
  [[not_reported]]
    score = 5
  [[very_rare]]
    score = 5
    lower = 0
    upper = 10
  [[rare]]
    score = 3
    lower = 10
    upper = 30
  [[intermediate]]
    score = 1
    lower = 30
    upper = 100
  [[common]]
    score = -1
    lower = 100
    upper = 100000

[sv_len]
  category = variant_length
  data_type = integer
  description = The length of the structural variant
  field = INFO
  info_key = SVLEN
  record_rule = min
  separators = ',',

# SCALE. Unimodal, peaking at 1 kb - 100 kb, the exon-to-multi-gene range where a
# CNV call is both most often real and most often diagnostic. Scores fall away on
# both sides and bottom out at 0; nothing here is negative, per the principle at
# the top of this file.
#
#     50 bp -   1 kb    3
#      1 kb - 100 kb    4     <- peak
#    100 kb -   1 Mb    3
#      1 Mb -   5 Mb    2
#          above 5 Mb   0     <- neutral, not penalised
#
# Above 5 Mb scores 0 because such segments are effectively absent from WES and
# unreliable on WGS, where read-depth callers produce them as artefacts. 0 leaves
# such a variant to be ranked on consequence and gene constraint rather than on
# its length.
#
# BOUNDS ARE TOUCHING, not offset by one (100000/100000, not 100000/100001).
# genmod uses half-open intervals [lower, upper), so offset bounds leave the
# boundary value itself in no bucket: under the previous style an SVLEN of
# exactly 100000 scored not_reported. gnomad_sv and loqusdb_obs_sv already use
# touching bounds.
#
# SVLEN is absent from gatkCNV segments, so this plugin is Manta / TIDDIT /
# CNVnator only until SVLEN is filled upstream. See the header.

  [[not_reported]]
    score = 0

  [[ultra_large_pos]]
    score = 0
    lower = 5000000
    upper = 100000000

  [[ultra_large_neg]]
    score = 0
    lower = -100000000
    upper = -5000000

  [[very_large_pos]]
    score = 2
    lower = 1000000
    upper = 5000000

  [[very_large_neg]]
    score = 2
    lower = -5000000
    upper = -1000000

  [[large_pos]]
    score = 3
    lower = 100000
    upper = 1000000

  [[large_neg]]
    score = 3
    lower = -1000000
    upper = -100000

  [[medium_pos]]
    score = 4
    lower = 1000
    upper = 100000

  [[medium_neg]]
    score = 4
    lower = -100000
    upper = -1000

  [[small_pos]]
    score = 3
    lower = 50
    upper = 1000

  [[small_neg]]
    score = 3
    lower = -1000
    upper = -50

[gene_intolerance_score]
  category = gene_intolerance_prediction
