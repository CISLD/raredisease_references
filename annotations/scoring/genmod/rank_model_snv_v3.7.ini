[loqusdb_obs]
field = INFO
data_type = integer
category = allele_frequency
record_rule = max
separators = ','
info_key = LOQUSDB_OBS
description = In-house LoqusDB observations, counted in CASES not alleles

# Thresholds are CASE COUNTS (0 .. NrCases; 1919 in the 20260814 export), not
# frequencies -- they are not comparable with the [gnomad] bounds above, which are on
# 0..1. Scored on Obs rather than Frq because the cohort is 1810 WES + 106 WGS sharing
# a single denominator and LoqusDB does not record the assay, so Frq understates
# anything outside the exome capture by up to ~18x.
#
# NEUTRAL SCORES -- do not lower these. allele_frequency aggregates with `min` (see
# [Categories]), so this plugin can only ever pull the category score DOWN.
# not_reported and very_rare are set to 4, the highest score [gnomad] can award, so a
# variant absent from or rare in the snapshot is left completely untouched. Dropping
# either below 4 would penalise every novel variant -- precisely the wrong direction.
#
# Derived 2026-08-17 from one WES case (51,933 variants) and one WGS case (397,797),
# annotated against the 20260814 snapshot:
#     median Obs    WES 978    WGS 3
#     absent        WES 0.5%   WGS 24.9%
# The same count means different things in the two assays: 200 is 10% of the cohort
# on-target, but is UNREACHABLE off-target, where only the 106 WGS cases can observe a
# variant at all (measured p99 = 90). The `intermediate` lower bound of 50 is therefore
# the real knob -- raise it above ~110 to make this plugin WES/on-target only, lower it
# to catch more recurrent WGS artefacts.
#
# Measured effect on variants [gnomad] scores >= 2, i.e. the ones ranking decides
# between: WES 53 -> -5, 25 -> -2, 45 -> 1 (of 1522). WGS 81 -> -5, 67 -> -2 and
# 6852 -> 1 (of 180,345) -- that last group being off-target variants carried by
# roughly half the WGS cohort.
#
# Starting values, not validated thresholds. Review against real cases before treating
# the resulting ranking as settled.

  [[not_reported]]
    score = 4
  [[common]]
    score = -5
    lower = 500
    upper = 100000
  [[semi-common]]
    score = -2
    lower = 200
    upper = 500
  [[intermediate]]
    score = 1
    lower = 50
    upper = 200
  [[rare]]
    score = 3
    lower = 10
    upper = 50
  [[very_rare]]
    score = 4
    lower = 0
    upper = 10

