[loftee]
category = loss_of_function
csq_key = LoF
data_type = string
field = INFO
info_key = CSQ
record_rule = max
separators = ','
string_match = exact
description = LOFTEE loss-of-function confidence (HC/LC)

# LOFTEE (konradjk/loftee, grch38 branch) only annotates pLoF consequences:
# stop_gained, frameshift and splice donor/acceptor. Its own category, because
# [most_severe_consequence] (max) already gives every pLoF 8, so a section there
# could never lower a filtered one. string_match = exact is required: as a
# substring, 'LC' matches every SLC* gene symbol in the CSQ.
#
# record_rule = max with HC above LC: HC in any transcript wins. LC means a
# LOFTEE filter fired (END_TRUNC, ANC_ALLELE, 5UTR/3UTR_SPLICE, rescued or
# non-disrupting splice, ...).
#
# HC +4 (v3.7): lifts truncating variants that ClinVar does not classify as
# pathogenic (validated: all five such causatives rank higher than with v3.5).
# The LC penalty is deliberately modest: true causatives can be LC, e.g.
# NMD-escaping last-exon truncations in dominant-negative genes.

  [[not_reported]]
    score = 0

  [[HC]]
    score = 4
    priority = 2
    string = 'HC'

  [[LC]]
    score = -1
    priority = 1
    string = 'LC'

