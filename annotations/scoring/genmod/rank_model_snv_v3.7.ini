[clnsig]
category = clinical_significance
csq_key = ClinVar_CLNSIG
data_type = string
field = INFO
info_key = CSQ
record_rule = max
separators = '&', '/'
string_match = exact
description = Clinical significance from ClinVar

# string_match = exact needs genmod 3.10.2+kisld.1 (setup/genmod in the 1-1-0 repo).
# genmod's default substring match runs against the WHOLE CSQ string, not the
# csq_key column, so up to v3.3 PolyPhen 'benign(...)' scored as ClinVar Benign
# (-5 on 3,915 HG002 WES variants with no ClinVar entry) and 'Pathogenic' matched
# inside 'Likely_pathogenic' / 'Conflicting_classifications_of_pathogenicity'.
#
# Exact matching compares single ClinVar terms: VEP turns ClinVar's ',' into '&'
# and the value is also split on '/', so 'Pathogenic/Likely_pathogenic' gives the
# tokens Pathogenic + Likely_pathogenic, and the highest-priority one is scored.
# Scores are carried over from v3.3. Priorities are reordered so that the
# pathogenic side wins over the benign side, and Likely_benign over Benign (v3.3's
# order) for 'Benign/Likely_benign'.
#
# Low penetrance is written 'Pathogenic,_low_penetrance' by ClinVar, i.e. the tokens
# Pathogenic + _low_penetrance. v3.3's 'Pathogenic_low_penetrance' rule never existed
# as a term; '_low_penetrance' now outranks Pathogenic so those variants get 10.
# Terms with no rule (drug_response, risk_factor, other, ...) score not_reported, 0.

  [[not_reported]]
    score = 0

  [[low_penetrance]]
    score = 10
    priority = 7
    string = '_low_penetrance'

  [[Pathogenic]]
    score = 17
    priority = 6
    string = 'Pathogenic'

  [[Likely_pathogenic]]
    score = 11
    priority = 5
    string = 'Likely_pathogenic'

  [[Conflicting_classifications_of_pathogenicity]]
    score = 1
    priority = 4
    string = 'Conflicting_classifications_of_pathogenicity'

  [[Uncertain_significance]]
    score = 2
    priority = 3
    string = 'Uncertain_significance'

  [[Likely_benign]]
    score = -2
    priority = 2
    string = 'Likely_benign'

  [[Benign]]
    score = -5
    priority = 1
    string = 'Benign'

  [[Uncertain_risk_allele]]
    score = 1
    priority = 1
    string = 'Uncertain_risk_allele'

