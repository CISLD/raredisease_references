# =============================================================================
# rank_model_snv v3.70   (v3.50 with LOFTEE HC raised from 0 to +4)
# =============================================================================
# Validated on 54 reported causatives: 43 in the 51 KC exomes of the 1-1-0
# pipeline validation (VEP 116.2, LOFTEE in CSQ) and 44 in the 42 callsets of
# the model validation (33 shared). Scored with the production genmod
# 3.10.2+kisld.1. See AI_data/rankmodel_v37/handover/README.md and the
# validation report in the same folder. There is no released v3.60: that
# number was used for a test model without [clinvar_review_status].
#
#   [loftee]                  HC +4, LC -1     (v3.5: 0 / -1;  v3.4: +1 / -3)
#   [most_severe_consequence] LoF terms 8       (v3.4: 8)
#   [loqusdb_obs]             <10:4  10-50:3  50-200:1  200-500:-2  >=500:-5
#                             (v3.4: <10:4 10-50:3 50-200:1 200-500:-2 >=500:-5)
# =============================================================================
